<!doctype html>
<!--
  Swagger UI viewer for openapi.yaml (loads Swagger UI from a CDN, so it needs internet).
  Browsers block fetching local files from file://, so serve this folder first:

      npx serve document/api        # then open the printed URL

  (Or paste openapi.yaml into https://editor.swagger.io.)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mini LMS API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      SwaggerUIBundle({
        url: "./openapi.yaml",
        dom_id: "#swagger-ui",
        // Send the session cookie when using "Try it out" against the running app.
        requestInterceptor: (req) => ((req.credentials = "include"), req),
      });
    </script>
  </body>
</html>
